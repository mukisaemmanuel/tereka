<!-- ============================================================
     login.html — Login page for Tereka
     ============================================================
     Simple form with email and password fields.
     Extends base.html so it gets the flash messages
     but NOT the navbar (since user isn't logged in).
     ============================================================ -->
{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to manage your finances</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
        <!-- Email field -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required
                   placeholder="you@example.com" autocomplete="email">
        </div>

        <!-- Password field -->
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required
                   placeholder="Enter your password" autocomplete="current-password">
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn btn-primary btn-full">Log In</button>
    </form>

    <!-- Link to register page -->
    <p class="auth-footer">
        Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
    </p>
</div>
{% endblock %}
