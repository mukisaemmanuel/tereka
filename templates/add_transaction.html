<!-- ============================================================
     add_transaction.html — Form to log a new transaction
     ============================================================ -->
{% extends "base.html" %}

{% block title %}Add Transaction{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Transaction</h1>
    <p class="page-subtitle">Log a new income or expense</p>
</div>

<div class="card card-form">
    <form method="POST" action="{{ url_for('add_transaction') }}" class="form-layout">

        <!-- Transaction type: income or expense -->
        <div class="form-group">
            <label for="type">Type</label>
            <select id="type" name="type" required>
                <option value="">Select type</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>

        <!-- Amount -->
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01"
                   required placeholder="0.00">
        </div>

        <!-- Category dropdown — populated from the database -->
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select category</option>
                {% for cat in categories %}
                <option value="{{ cat.name }}">{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Description — optional -->
        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" name="description"
                   placeholder="What was this for?" maxlength="255">
        </div>

        <!-- Date — defaults to today -->
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <!-- Submit button -->
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Transaction</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<!-- Set the date input to today's date by default -->
<script>
    document.getElementById('date').valueAsDate = new Date();
</script>
{% endblock %}
