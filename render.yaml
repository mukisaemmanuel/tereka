services:
  - type: web
    name: tereka-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
